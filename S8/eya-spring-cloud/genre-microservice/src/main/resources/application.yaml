server:
  port: 8060
spring:
  application:
    name: genre
  datasource:
    # url: 'jdbc:h2:mem:gendb'
    url: 'jdbc:mysql://mysqldb:3306/test?useSSL=false&serverTimezone=UTC'
    username: root
    password: root
  # h2:
    # console:
      # enabled: true


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  eureka:
    client:
      service-url:
        defaultZone: 'http://localhost:8761/eureka/'
  config:
    import: "optional:configserver:http://localhost:9999/"

  profiles:
    active: "prod"


management:
  endpoints:
    web:
      exposure:
        include: '*'
eureka:
  instance:
    prefer-ip-address: true


