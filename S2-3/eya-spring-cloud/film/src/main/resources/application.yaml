server:
  port: 8081

spring:
  application:
    name: film

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: 'jdbc:h2:mem:filmsdb'

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'