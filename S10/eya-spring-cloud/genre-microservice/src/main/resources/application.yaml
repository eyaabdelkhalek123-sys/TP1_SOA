server:
  port: 8060
spring:
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

  application:
    name: genre
  datasource:
    url: 'jdbc:h2:mem:gendb'
  h2:
    console:
      enabled: true

  profiles:
    active: "prod"

#    url: 'jdbc:mysql://mysqldb:3306/test?useSSL=false&serverTimezone=UTC'
#    username: root
#    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true

  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

#  eureka:
#    client:
#      service-url:
#        defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
#    instance:
#      prefer-ip-address: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'



