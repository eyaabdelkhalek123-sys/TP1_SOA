server:
  port: 8089

spring:
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

  application:
    name: film

  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

  #config:
    #import: "optional:configserver:http://localhost:8888"

  datasource:
    url: 'jdbc:h2:mem:filmsdb'

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    config:
      enabled: true
      import-check:
        enabled: false
    discovery:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
#author:
#  name: Eya
